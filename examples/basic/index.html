<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canvas Toolkit Example</title>
    <link rel="icon" type="image/png" sizes="320x320" href="./assets/canvas-toolkit.png">

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            background: #202020;
        }

        canvas {
            border: 1px solid #666;
            background: white;
        }
    </style>
</head>

<body>
    <canvas
        id="canvas"
        width="1200"
        height="1000"
    ></canvas>

    <script type="module" src="./main.ts"></script>
</body>
</html>
